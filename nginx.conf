# Use all available CPU cores
worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version from responses
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Performance: efficient file transfer and connection handling
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # File descriptor cache for static files
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    80s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Buffer tuning
    client_body_buffer_size  16k;
    client_max_body_size     1m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers           2 32k;
    postpone_output          1460;

    # Gzip compression — only for text types; images are already compressed
    # and re-compressing them wastes CPU with no size benefit.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # All media (manga chapter images, profile pictures, stickers) is served
        # directly from Garage object storage, not by Nginx — see S3_*_PUBLIC_BASE_URL.

        # Health check endpoint
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
