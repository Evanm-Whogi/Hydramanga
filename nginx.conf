# Use all available CPU cores
worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version from responses
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Performance: efficient file transfer and connection handling
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # File descriptor cache for static files
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    80s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Buffer tuning
    client_body_buffer_size  16k;
    client_max_body_size     1m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers           2 32k;
    postpone_output          1460;

    # Gzip compression — only for text types; images are already compressed
    # and re-compressing them wastes CPU with no size benefit.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Referer validation — allow empty referer (direct links, server requests)
    # and whitelisted site origins. Block everything else.
    map $http_referer $valid_referer {
        default                                         0;
        ""                                              1;  # empty = direct access
        "~^https?://(manga\.chit\.sh|mangadev\.chit\.sh)" 1;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve manga images
        location /media/manga/ {
            alias /data/manga/;

            # Referer validation
            if ($valid_referer = 0) {
                return 403;
            }

            # Long-lived immutable cache — files are content-addressed by path
            expires 1y;
            add_header Cache-Control "public, immutable" always;

            # CORS — allow browsers on whitelisted origins to load images
            add_header Access-Control-Allow-Origin  "*"              always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS"   always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;

            # Security headers
            add_header X-Content-Type-Options         "nosniff"                       always;
            add_header Referrer-Policy                "strict-origin-when-cross-origin" always;

            # Preflight
            if ($request_method = OPTIONS) {
                return 204;
            }

            # Only serve GET requests; deny everything else
            limit_except GET {
                deny all;
            }

            autoindex off;
            try_files $uri =404;
        }

        # Serve profile pictures
        location /media/pfp/ {
            alias /data/profile-pictures/;

            # Allow access to profile pictures (no referer validation needed)
            # Long-lived cache for profile pictures
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;

            # CORS — allow browsers to load images
            add_header Access-Control-Allow-Origin  "*"              always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS"   always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;

            # Security headers
            add_header X-Content-Type-Options         "nosniff"                       always;
            add_header Referrer-Policy                "strict-origin-when-cross-origin" always;

            # Preflight
            if ($request_method = OPTIONS) {
                return 204;
            }

            # Only serve GET requests; deny everything else
            limit_except GET {
                deny all;
            }

            autoindex off;
            try_files $uri =404;
        }

        # Health check endpoint
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
