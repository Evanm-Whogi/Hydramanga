version: '3.9'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mang
      POSTGRES_PASSWORD: mangpass
      POSTGRES_DB: mang
    volumes:
      - ./data/db/data:/var/lib/postgresql/data
      - ./data/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"  # Expose on 5433 to avoid conflict with local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mang"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"  # Expose on 6380 to avoid conflict with local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/manga:/data/manga:ro
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DOCKER: 'true'
      DATABASE_URL: postgres://mang:mangpass@db:5432/mang
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PUBLIC_APP_URL: https://manga.chit.sh
      # Base URL for media files served by Nginx (via cloudflared tunnel)
      MEDIA_BASE_URL: https://manga.chit.sh/media/manga
      # Storage root for downloaded manga (must match Nginx volume)
      CHAPTER_STORAGE_ROOT: /data/manga
    volumes:
      - ./data/manga:/data/manga
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/admin/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://server:4000
    env_file:
      - ./client/.env
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Used by Next.js rewrites and server-side calls
      BACKEND_INTERNAL_URL: http://server:4000
      # Public site origin for OAuth redirects and metadata
      NEXT_PUBLIC_URL: https://manga.chit.sh
    ports:
      - "3000:3000"
