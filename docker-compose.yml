services:
  db:
    image: postgres:16
    shm_size: '2gb'
    restart: unless-stopped
    environment:
      POSTGRES_USER: mang
      POSTGRES_PASSWORD: mangpass
      POSTGRES_DB: mang
    volumes:
      - ./data/db/data:/var/lib/postgresql/data
      - ./data/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"  # Expose on 5433 to avoid conflict with local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mang"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: mangpass
    command: >
      sh -c "psql -h db -U mang -d mang -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'"
    restart: on-failure:3

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"  # Expose on 6380 to avoid conflict with local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/manga:/data/manga:ro
      - ./data/profile-pictures:/data/profile-pictures:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DOCKER: 'true'
      RUN_WORKERS: 'false'
      DATABASE_URL: postgres://mang:mangpass@db:5432/mang
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PUBLIC_APP_URL: https://mangadev.chit.sh
      # Base URL for media files served by Nginx (via cloudflared tunnel)
      MEDIA_BASE_URL: https://mangadev.chit.sh/media/manga
      # Storage root for downloaded manga (must match Nginx volume)
      CHAPTER_STORAGE_ROOT: /data/manga
    volumes:
      - ./data/manga:/data/manga
      - ./data/profile-pictures:/data/profile-pictures
      - ./cloudflared-config.yml:/app/cloudflared-config.yml:ro
      - ${HOME}/.cloudflared:/root/.cloudflared:ro
    # Port removed - backend only accessible via Next.js proxy and internal docker network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/admin/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RUN_WORKERS: 'true'
      DATABASE_URL: postgres://mang:mangpass@db:5432/mang
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHAPTER_STORAGE_ROOT: /data/manga
      MEDIA_BASE_URL: https://manga.chit.sh/media/manga
    volumes:
      - ./data/manga:/data/manga
      - ./data/profile-pictures:/data/profile-pictures
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 8G
        reservations:
          cpus: '0.25'
          memory: 512M

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://server:4000
    env_file:
      - ./client/.env
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Used by Next.js rewrites and server-side calls
      BACKEND_INTERNAL_URL: http://server:4000
      # Public site origin for OAuth redirects and metadata
      NEXT_PUBLIC_URL: https://manga.chit.sh
      # Public backend URL for WebSocket connections from client
      NEXT_PUBLIC_BACKEND_URL: https://manga.chit.sh

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - /home/whogi/.cloudflared/8ec597a9-f14c-440a-a59b-4f3935ba3e84.json:/etc/cloudflared/creds.json:ro
    command: tunnel --config /etc/cloudflared/config.yml run
    depends_on:
      - nginx
      - server
      - web