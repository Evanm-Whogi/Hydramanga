version: '3.9'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mang
      POSTGRES_PASSWORD: mangpass
      POSTGRES_DB: mang
    volumes:
      - ./data/db/data:/var/lib/postgresql/data
      - ./data/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"  # Expose on 5433 to avoid conflict with local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mang"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"  # Expose on 6380 to avoid conflict with local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DOCKER: 'true'
      DATABASE_URL: postgres://mang:mangpass@db:5432/mang
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PUBLIC_APP_URL: http://localhost:3000
      # Add other required envs here, e.g. JWT secrets, email creds, storage paths
      CHAPTER_STORAGE_ROOT: /data/chapters
      # Public URL clients should use to load chapter images/files (via frontend rewrite)
      CHAPTER_PUBLIC_BASE: http://localhost:3000/api/manga-files
      # Path to series.json file
      SERIES_JSON_PATH: /data/series.json
    volumes:
      - ./data/mangas:/data/chapters
      - ./data/series.json:/data/series.json:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://server:4000
    env_file:
      - ./client/.env
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # Used by Next.js rewrites and server-side calls
      BACKEND_INTERNAL_URL: http://server:4000
      # Public site origin for OAuth redirects and metadata
      NEXT_PUBLIC_URL: http://localhost:3000
    ports:
      - "3000:3000"
